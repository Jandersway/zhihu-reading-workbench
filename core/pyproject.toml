[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-knowledge-agent"
version = "0.1.0"
description = "A source-grounded agent over an existing personal Zhihu Markdown corpus"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
redis = ["redis>=5,<7"]

[project.scripts]
zhihu-agent = "zhihu_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhihu_agent = ["skills/*/SKILL.md"]
